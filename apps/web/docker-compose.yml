services:
  grok-workbench-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: grok-workbench-web
    restart: unless-stopped
    environment:
      GROK2API_URL: http://host.docker.internal:38695
      MEDIA_ROOT: /grok2api-data/media
      APP_DATA_ROOT: /app/data
    ports:
      - "38696:80"
    volumes:
      - grok2api_grok2api-data:/grok2api-data:ro
      - grok-workbench-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  grok2api_grok2api-data:
    external: true
  grok-workbench-data:
