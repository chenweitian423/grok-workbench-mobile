name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm --workspace apps/mobile run prebuild -- --platform ios --clean
      - name: Build unsigned app
        run: |
          cd apps/mobile
          xcodebuild \
            -workspace ios/GrokWorkbench.xcworkspace \
            -scheme GrokWorkbench \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        id: package
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          APP_PATH=$(find apps/mobile/build -path "*/Release-iphoneos/*.app" -type d | head -n 1)
          mkdir -p Payload artifacts
          cp -R "$APP_PATH" Payload/GrokWorkbench.app
          zip -qry "artifacts/GrokWorkbench-v${VERSION}-${GITHUB_RUN_NUMBER}-unsigned.ipa" Payload
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: GrokWorkbench-iOS-v${{ steps.package.outputs.version }}-${{ github.run_number }}-unsigned
          path: artifacts/*.ipa
