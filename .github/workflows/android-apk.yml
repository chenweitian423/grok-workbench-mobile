name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm --workspace apps/mobile run build:android
      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "artifacts/GrokWorkbench-v${{ steps.version.outputs.value }}-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: GrokWorkbench-Android-v${{ steps.version.outputs.value }}-${{ github.run_number }}
          path: artifacts/*.apk
